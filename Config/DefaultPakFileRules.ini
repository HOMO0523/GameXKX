; Shipping uses the explicit 2K battle atlases for full-screen battles and the
; explicit 1K siblings for the compact desktop travel strip.  The unsuffixed
; character/enemy atlases are retained in Content as 4K source-of-truth masters
; and are only selected by the development comparison fixture's ".4K" token.
;
; Keep the source assets untouched, but leave those masters out of Win64
; Shipping containers.  The negative rules are more-specific exceptions that
; keep every 1K/2K runtime sibling in the package.
[ExcludeLegacyBattleAnimationMastersFromShipping]
Platforms="Windows"
Targets="Shipping"
bExcludeFromPaks=true
bOverrideChunkManifest=true
+Files=".../GameXXK/Content/GameXXK/BattleAnimations/Atlases/T_character_*_atlas.*"
