; Clip-driven exclusion (2026-09-11).
;
; FGameXXKBattleAnimationPresentation::ResolveClip returns an empty descriptor for
; Hit and Death, ResolveClipForDefinition delegates to that same early-out, and
; ResolveCompactTravelClipPair maps both actions onto Idle as procedural poses
; ("Hit/death ... are procedural poses on Idle"). ResolveActionSuffix still carries
; dead "hit"/"death" branches that the early-out makes unreachable.
;
; The container ships no HitSprites/DeathSprites flipbook set - only IdleSprites and
; IdleFlipbooks - so these atlases have no importer and no dangling reference is left
; behind. 42 hit + 42 death entries, ~62 MB. Source assets stay in Content; only
; Shipping containers omit them, so the set is reversible.
[ExcludeUnrequestedHitDeathAtlasesFromShipping]
Platforms="Windows"
Targets="Shipping"
bExcludeFromPaks=true
bOverrideChunkManifest=true
+Files=".../GameXXK/Content/GameXXK/BattleAnimations/Atlases/T_character_*_hit_atlas.*"
+Files=".../GameXXK/Content/GameXXK/BattleAnimations/Atlases/T_character_*_death_atlas.*"
+Files=".../GameXXK/Content/GameXXK/BattleAnimations/Atlases/T_enemy_*_hit_atlas.*"
+Files=".../GameXXK/Content/GameXXK/BattleAnimations/Atlases/T_enemy_*_death_atlas.*"

