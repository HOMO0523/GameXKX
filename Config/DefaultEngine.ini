[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False

; ---------------------------------------------------------------------------
; Pure-2D shader-permutation pruning (2026-09-11).
;
; The desktop workbench, the BattleBoard and every presentation surface in this
; project are UMG/Slate and Paper2D sprites, so none of the deferred-renderer
; feature sets below are ever sampled at runtime.  They were left at the new
; project template defaults and were compiling a full next-gen global shader
; library: the cooked ShaderTypeStats CSVs attributed 54.0 MB to Lumen, 26.9 MB
; to ray tracing, 13.1 MB to Nanite, 13.8 MB to the shadow and mesh-distance-field
; families -- 55% of all cooked shader bytecode.
;
; Each switch below is ECVF_ReadOnly and read at cook time, i.e. these are the
; documented "reduce the number of shaders" gates rather than runtime toggles.
; Turning a runtime effect off alone would NOT have shrunk the container.
; ---------------------------------------------------------------------------
r.Lumen.Supported=0
r.PathTracing=0
r.Nanite.ProjectEnabled=0

r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.RayTracing=False
r.RayTracing.RayTracingProxies.ProjectEnabled=False

r.Shadow.Classic.ProjectEnabled=0
r.Shadow.Virtual.Enable=0
r.Shadow.Virtual.ProjectEnabled=0
r.Shadow.Virtual.NonNanite.ProjectEnabled=0
r.Shadow.TranslucentPerObject.ProjectEnabled=0
r.GenerateMeshDistanceFields=False

r.SkinCache.CompileShaders=True

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.CustomDepth=3

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.EyeAdaptation.CachedLightingPreExposure=8.0

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

; Both SM6 (DX12) and SM5 (DX11) are cooked deliberately.
;
; FGameXXKDesktopSwapchainProvider::IsRuntimeSupported() requires D3D12 plus DWM
; composition, so the F10 desktop overlay only works on DX12.  Dropping SM5 would
; therefore look like free weight -- but it is not: without SM5 a DX11-only machine
; cannot start the game at all, and this build must open on as many machines as
; possible.  SM5 keeps those machines able to launch (plain window rather than the
; overlay form).  Cost is roughly 9.5 MiB of the container; that is accepted.
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
