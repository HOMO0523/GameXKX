<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主角与六伙伴 · 比例画风对照</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e9e8e1;color:#263235;font:15px system-ui}h1{font-size:23px;margin:0 0 10px}p{line-height:1.7;max-width:1120px;color:#606e70}.bar{display:flex;gap:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}figure{margin:0;background:#fffef8;border-radius:10px;overflow:hidden}.stage{position:relative;aspect-ratio:1;overflow:hidden}.stage img{position:absolute;width:100%;top:0;left:0}.aligned img{width:calc(100% * var(--s));left:calc((1 - var(--s)) * 50%);top:calc(100% * var(--o))}.aligned .stage:after{content:"";position:absolute;inset:auto 0 6%;border-bottom:1px dashed #778c8260;pointer-events:none}.gray img{filter:grayscale(1)}figcaption{padding:10px 13px;font-weight:650}small{display:block;font-weight:400;color:#737e7d;margin-top:5px;line-height:1.5}button{padding:7px 14px;background:#fff;border:1px solid #adbdb5;border-radius:7px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>两位主角与六位伙伴</h1><p>默认将头部主体顶部至脚底的显示高度近似对齐，排除发髻、羽饰、触角和大型道具的高度影响。仅等比缩放显示，未修改原图；对齐位置为目测辅助，不是精确头身比测量。</p><div class="bar"><label><input id="align" type="checkbox" checked>近似统一身体显示高度</label><label><input id="gray" type="checkbox">灰度比较</label></div><div class="grid aligned" id="grid"><figure><a href="male-hero-clean-v7.png"><div class="stage" style="--s:0.9473558648111332;--o:0.0712127236580516"><img src="male-hero-clean-v7.png" alt="男主 · 前襟整合版"></div></a><figcaption>男主 · 前襟整合版<small>保留原比例，白布改为蓝灰短前襟与米白包边</small></figcaption></figure><figure><a href="female-hero-refined-v2.png"><div class="stage" style="--s:0.8301742160278746;--o:0.12703832752613242"><img src="female-hero-refined-v2.png" alt="女主 · 服饰精修版"></div></a><figcaption>女主 · 服饰精修版<small>保留双髻，细化领口与衣摆层次，小幅收窄裤腿</small></figcaption></figure><figure><a href="../cast-selected-20260914/01-blade.png"><div class="stage" style="--s:0.8562803234501347;--o:0.10147349505840075"><img src="../cast-selected-20260914/01-blade.png" alt="刀客 · 确认稿"></div></a><figcaption>刀客 · 确认稿<small>画风与人体比例参照</small></figcaption></figure><figure><a href="../cast-selected-20260914/02-archer.png"><div class="stage" style="--s:0.8323493449781659;--o:0.13021834061135362"><img src="../cast-selected-20260914/02-archer.png" alt="弓手 · 确认稿"></div></a><figcaption>弓手 · 确认稿<small>画风与人体比例参照</small></figcaption></figure><figure><a href="../cast-selected-20260914/03-butterfly-refined-v2.png"><div class="stage" style="--s:0.9076571428571428;--o:0.04971428571428571"><img src="../cast-selected-20260914/03-butterfly-refined-v2.png" alt="蝴蝶道士 · 细线修正版"></div></a><figcaption>蝴蝶道士 · 细线修正版<small>大色块与简化程度参照</small></figcaption></figure><figure><a href="../cast-style-trial-20260914/formation-trial-v1.png"><div class="stage" style="--s:0.9389556650246306;--o:0.04896551724137921"><img src="../cast-style-trial-20260914/formation-trial-v1.png" alt="阵师 · 试改"></div></a><figcaption>阵师 · 试改<small>比例依然偏修长</small></figcaption></figure><figure><a href="../cast-style-trial-20260914/healer-trial-v1.png"><div class="stage" style="--s:0.8509285714285715;--o:0.1053571428571427"><img src="../cast-style-trial-20260914/healer-trial-v1.png" alt="药师 · 试改"></div></a><figcaption>药师 · 试改<small>较柔和、紧凑的角色参照</small></figcaption></figure><figure><a href="../cast-style-trial-20260914/guard-trial-v2-larger-head.png"><div class="stage" style="--s:0.83968281938326;--o:0.11973568281938318"><img src="../cast-style-trial-20260914/guard-trial-v2-larger-head.png" alt="守卫 · 最新大头版"></div></a><figcaption>守卫 · 最新大头版<small>宽体型与大盾为职业特征</small></figcaption></figure></div><p><strong>当前判断：</strong>男主采用最新原比例修正版：保留圆脸和露额束发，衣缘改为连续包边与简化竹叶纹。其余采用当前六伙伴版本与女主服饰精修版。此页只调整显示尺度，原图均保留。</p><p><a href="../cast-selected-20260914/07-male-hero.png">男主原发型</a> · <a href="../cast-selected-20260914/08-female-hero.png">女主原发型</a> · <a href="generation-records-v2.json">内置 imagegen 提示词与版本记录</a></p><script>const g=document.getElementById('grid');document.getElementById('align').onchange=e=>g.classList.toggle('aligned',e.target.checked);document.getElementById('gray').onchange=e=>g.classList.toggle('gray',e.target.checked)</script></html>
