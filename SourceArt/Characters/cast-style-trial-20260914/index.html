<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色画风试改对照</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e9e8e1;color:#283133;font:15px system-ui}h1{font-size:23px;margin:0 0 10px}p{line-height:1.6;color:#657070}.bar{display:flex;gap:12px;align-items:center;margin:18px 0}button{padding:10px 18px;border:1px solid #a2afab;border-radius:8px;background:white;cursor:pointer}button.active{background:#24594f;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:0;background:#fffffa;border-radius:10px;overflow:hidden}img{width:100%;display:block}figcaption{padding:9px 13px;font-weight:600}.gray img{filter:grayscale(1)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>确认稿 × 画风试改</h1><p>上排：刀客、弓手、蝴蝶道士，作为固定参照。下排：阵师、药师、青年守卫，可切换改前与试改。均为原比例展示，未拉伸。</p><div class="bar"><button class="active" id="after">查看试改</button><button id="before">查看改前</button><label><input id="gray" type="checkbox">灰度</label></div><div class="grid" id="grid"><figure><a href="../cast-selected-20260914/01-blade.png"><img src="../cast-selected-20260914/01-blade.png" alt="刀客 · 确认稿"></a><figcaption>刀客 · 确认稿</figcaption></figure><figure><a href="../cast-selected-20260914/02-archer.png"><img src="../cast-selected-20260914/02-archer.png" alt="弓手 · 确认稿"></a><figcaption>弓手 · 确认稿</figcaption></figure><figure><a href="../cast-selected-20260914/03-butterfly.png"><img src="../cast-selected-20260914/03-butterfly.png" alt="蝴蝶道士 · 确认稿"></a><figcaption>蝴蝶道士 · 确认稿</figcaption></figure><figure><a class="target-link" href="formation-trial-v1.png"><img class="target" src="formation-trial-v1.png" data-after="formation-trial-v1.png" data-before="../cast-selected-20260914/04-formation.png" alt="阵师"></a><figcaption>阵师 · <span class="state">试改</span></figcaption></figure><figure><a class="target-link" href="healer-trial-v1.png"><img class="target" src="healer-trial-v1.png" data-after="healer-trial-v1.png" data-before="../cast-selected-20260914/05-healer.png" alt="药师"></a><figcaption>药师 · <span class="state">试改</span></figcaption></figure><figure><a class="target-link" href="guard-trial-v2-larger-head.png"><img class="target" src="guard-trial-v2-larger-head.png" data-after="guard-trial-v2-larger-head.png" data-before="../cast-selected-20260914/06-guard-young-v2.png" alt="守卫"></a><figcaption>守卫 · <span class="state">试改</span></figcaption></figure></div><p>观察：药师碎切面减少最明显；守卫金属与毛领的明暗更概括；阵师山水简化，但卷轴位置发生变化、比例仍偏修长。本轮为试改，旧稿保留。</p><script>function setMode(mode){document.querySelectorAll('.target').forEach(img=>{img.src=img.dataset[mode];img.parentElement.href=img.src});document.querySelectorAll('.state').forEach(x=>x.textContent=mode==='after'?'试改':'改前');['before','after'].forEach(x=>document.getElementById(x).classList.toggle('active',x===mode))}document.getElementById('after').onclick=()=>setMode('after');document.getElementById('before').onclick=()=>setMode('before');document.getElementById('gray').onchange=e=>document.getElementById('grid').classList.toggle('gray',e.target.checked)</script></html>
