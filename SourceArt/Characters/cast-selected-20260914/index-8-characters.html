<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八角色画风对照</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e9e8e1;color:#293032;font:15px system-ui}h1{margin:0 0 8px;font-size:24px}.hint{color:#697072;max-width:1000px;line-height:1.7}.controls{display:flex;gap:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}figure{margin:0;background:#fffef8;border-radius:10px;overflow:hidden}.stage{position:relative;aspect-ratio:1;overflow:hidden}.stage img{position:absolute;width:100%;left:0;top:0}.normalized img{width:calc(100% * var(--scale));left:calc((1 - var(--scale)) * 50%);top:calc(100% * var(--offset))}.gray img{filter:grayscale(1)}figcaption{padding:10px 14px;font-weight:650}a{color:inherit}footer{line-height:1.8;margin-top:20px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>男主、女主与六位伙伴</h1><div class="hint">原图对照；守卫采用青年版，阵师采用最新站姿版。默认仅在页面中等比缩放，近似统一完整剪影高度，便于比较画风；不代表设定身高。两位主角沿用项目 protagonist-pair-v1。</div><div class="controls"><label><input id="size" type="checkbox" checked> 对齐完整剪影高度</label><label><input id="gray" type="checkbox"> 灰度比较明暗</label></div><div class="grid normalized" id="grid"><figure><a href="07-male-hero.png"><div class="stage" style="--scale:1.1529223378702962;--offset:-0.06385108086469171"><img src="07-male-hero.png" alt="男主"></div></a><figcaption>男主</figcaption></figure><figure><a href="08-female-hero.png"><div class="stage" style="--scale:1.1180124223602483;--offset:-0.05551242236024834"><img src="08-female-hero.png" alt="女主"></div></a><figcaption>女主</figcaption></figure><figure><a href="01-blade.png"><div class="stage" style="--scale:0.961328790459966;--offset:0.00860306643952291"><img src="01-blade.png" alt="刀客"></div></a><figcaption>刀客</figcaption></figure><figure><a href="02-archer.png"><div class="stage" style="--scale:0.9444351464435147;--offset:0.031171548117154724"><img src="02-archer.png" alt="弓手"></div></a><figcaption>弓手</figcaption></figure><figure><a href="03-butterfly.png"><div class="stage" style="--scale:0.9304204451772465;--offset:0.035160758450123564"><img src="03-butterfly.png" alt="蝴蝶术师"></div></a><figcaption>蝴蝶术师</figcaption></figure><figure><a href="04-formation.png"><div class="stage" style="--scale:0.9987610619469027;--offset:0.01814159292035389"><img src="04-formation.png" alt="阵师"></div></a><figcaption>阵师</figcaption></figure><figure><a href="05-healer.png"><div class="stage" style="--scale:0.9373754152823921;--offset:0.03056478405315599"><img src="05-healer.png" alt="药师"></div></a><figcaption>药师</figcaption></figure><figure><a href="06-guard-young-v2.png"><div class="stage" style="--scale:0.967095115681234;--offset:0.0037275064267351388"><img src="06-guard-young-v2.png" alt="青年守卫"></div></a><figcaption>青年守卫</figcaption></figure></div><footer><strong>画风判断：</strong>两位主角保留更多发丝、衣褶、编织细线与柔和过渡；伙伴更强调粗轮廓、大明暗块和道具剪影。男主、女主的圆眼与圆脸更偏卡通，伙伴的面部更偏概括的动漫造型。<br><strong>建议顺序：</strong>先合并主角的头发与衣服阴影，再简化竹篓和绑腿线条、加重外轮廓；保留朴素服饰与角色识别点。伙伴内部也仍有差异：蝴蝶最平面化，刀客笔触偏多，药师头发与葫芦切面偏密。</footer><script>const grid=document.getElementById('grid');document.getElementById('size').onchange=e=>grid.classList.toggle('normalized',e.target.checked);document.getElementById('gray').onchange=e=>grid.classList.toggle('gray',e.target.checked);</script></html>
