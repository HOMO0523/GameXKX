<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十四角色 · NPC画风统一</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e9e8e1;color:#283333;font:15px system-ui}h1{font-size:24px;margin:0 0 8px}p{line-height:1.7;color:#64706f;margin:0 0 15px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}button,select{background:#fff;border:1px solid #aebbb5;border-radius:7px;padding:9px 14px;color:#283333;cursor:pointer}button.active{background:#24584c;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}figure{margin:0;background:#fffef8;border-radius:10px;overflow:hidden}img{width:100%;display:block}figcaption{padding:10px 13px;font-weight:650}small{font-size:12px;font-weight:400;color:#78847c;display:block;margin-top:4px}.gray img{filter:grayscale(1)}figure[hidden]{display:none}@media(min-width:1700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>主角、伙伴与 NPC · 十四角色</h1><p>八位当前角色 + 指定版本的六位 NPC。NPC 仅做描边与明暗清理，保留原服装、发型、体型、道具和姿态。图像等比展示，不代表游戏设定身高。</p><div class="bar"><button id="after" class="active">NPC 轻调版</button><button id="before">NPC 原版</button><select id="filter"><option value="all">全部十四位</option><option value="NPC">只看六位 NPC</option><option value="当前阵容">只看当前八人</option></select><label><input id="gray" type="checkbox">灰度比较</label></div><div id="grid" class="grid"><figure data-group="当前阵容"><a href="male-hero.png"><img src="male-hero.png" alt="男主" ></a><figcaption>男主<small>当前版本</small></figcaption></figure><figure data-group="当前阵容"><a href="female-hero.png"><img src="female-hero.png" alt="女主" ></a><figcaption>女主<small>当前版本</small></figcaption></figure><figure data-group="当前阵容"><a href="blade-longer-legs-v2.png"><img src="blade-longer-legs-v2.png" alt="刀客" ></a><figcaption>刀客<small>当前版本</small></figcaption></figure><figure data-group="当前阵容"><a href="archer.png"><img src="archer.png" alt="弓手" ></a><figcaption>弓手<small>当前版本</small></figcaption></figure><figure data-group="当前阵容"><a href="butterfly.png"><img src="butterfly.png" alt="蝴蝶道士" ></a><figcaption>蝴蝶道士<small>当前版本</small></figcaption></figure><figure data-group="当前阵容"><a href="formation-compact-v2.png"><img src="formation-compact-v2.png" alt="阵师" ></a><figcaption>阵师<small>当前版本</small></figcaption></figure><figure data-group="当前阵容"><a href="healer.png"><img src="healer.png" alt="药师" ></a><figcaption>药师<small>当前版本</small></figcaption></figure><figure data-group="当前阵容"><a href="guard.png"><img src="guard.png" alt="守卫" ></a><figcaption>守卫<small>当前版本</small></figcaption></figure><figure data-group="NPC"><a href="tusi_chief-aligned-v1.png"><img src="tusi_chief-aligned-v1.png" alt="土司首领" class="npc" data-after="tusi_chief-aligned-v1.png" data-before="tusi_chief-original.png"></a><figcaption>土司首领<small>NPC · <span class='state'>轻调版</span></small></figcaption></figure><figure data-group="NPC"><a href="song_jin_bao-aligned-v1.png"><img src="song_jin_bao-aligned-v1.png" alt="宋金宝" class="npc" data-after="song_jin_bao-aligned-v1.png" data-before="song_jin_bao-original.png"></a><figcaption>宋金宝<small>NPC · <span class='state'>轻调版</span></small></figcaption></figure><figure data-group="NPC"><a href="you_bai-aligned-v1.png"><img src="you_bai-aligned-v1.png" alt="幽白" class="npc" data-after="you_bai-aligned-v1.png" data-before="you_bai-original.png"></a><figcaption>幽白<small>NPC · <span class='state'>轻调版</span></small></figcaption></figure><figure data-group="NPC"><a href="zhou_guang_zu-aligned-v1.png"><img src="zhou_guang_zu-aligned-v1.png" alt="周光祖" class="npc" data-after="zhou_guang_zu-aligned-v1.png" data-before="zhou_guang_zu-original.png"></a><figcaption>周光祖<small>NPC · <span class='state'>轻调版</span></small></figcaption></figure><figure data-group="NPC"><a href="jin_gui-aligned-v1.png"><img src="jin_gui-aligned-v1.png" alt="金贵" class="npc" data-after="jin_gui-aligned-v1.png" data-before="jin_gui-original.png"></a><figcaption>金贵<small>NPC · <span class='state'>轻调版</span></small></figcaption></figure><figure data-group="NPC"><a href="qiong_yao_er-aligned-v1.png"><img src="qiong_yao_er-aligned-v1.png" alt="琼幺儿" class="npc" data-after="qiong_yao_er-aligned-v1.png" data-before="qiong_yao_er-original.png"></a><figcaption>琼幺儿<small>NPC · <span class='state'>轻调版</span></small></figcaption></figure></div><p style="margin-top:20px">保留原图及本轮独立版本。<a href="manifest.json">版本来源与 imagegen 提示词</a> · <a href="user-npc-reference.png">用户指定总览</a></p><script>function setMode(m){document.querySelectorAll('.npc').forEach(x=>{x.src=x.dataset[m];x.parentElement.href=x.dataset[m]});document.querySelectorAll('.state').forEach(x=>x.textContent=m==='after'?'轻调版':'原版');['before','after'].forEach(x=>document.getElementById(x).classList.toggle('active',x===m))}document.getElementById('before').onclick=()=>setMode('before');document.getElementById('after').onclick=()=>setMode('after');document.getElementById('gray').onchange=e=>document.getElementById('grid').classList.toggle('gray',e.target.checked);document.getElementById('filter').onchange=e=>document.querySelectorAll('figure').forEach(f=>f.hidden=e.target.value!=='all'&&f.dataset.group!==e.target.value);</script></html>
