xample": "当前位置：3／5"}, {"name": "法术任务", "kind": "机制", "text": "所需不同卡牌各主动打出1次后，按首次记录顺序免费重放基础效果，再领取首牌阵赏。每个玩家回合最多完成1次。", "example": "任务进度：2／5"}, {"name": "阵赏", "kind": "机制", "text": "只有作为本次任务首牌的这张牌提供阵赏，在全部任务重放结束后结算。", "example": "首牌：〈卡名〉；本回合未完成"}, {"name": "通用", "kind": "机制", "text": "作为首牌时，第二张记录牌决定普通、火、冰、雷分支。第二张为核心或通用时，确定为普通。", "example": "已确定：寒冰"}, {"name": "自动入手", "kind": "机制", "text": "通用首牌基础效果结算后，其余未完成的携带法师牌从抽牌堆或弃牌堆入手；非首牌通用牌在任务开启后自动入手。每张通用牌每场限1次；满20张手牌时等待空位。", "example": "本场剩余：1次"}, {"name": "药方", "kind": "机制", "text": "首次打出额外消耗1气，开启本场持续效果。不同角色分别记录；药方产生的效果不会触发任何药方。", "example": "未开启：本次额外1气／已开启"}, {"name": "检索", "kind": "动作", "text": "从抽牌堆或弃牌堆选择1张符合牌面要求的牌加入手牌。已在手牌中的牌不能被检索；失败补偿按该牌说明。", "example": "可检索：〈数量〉张"}, {"name": "毒爆", "kind": "动作", "text": "按流血、中毒、灼烧、蚀伤的当前值，各结算1次持续伤害；数值为0的类型跳过，结算不消耗储量。", "example": "本次触发：中毒30、灼烧10"}, {"name": "冰爆", "kind": "动作", "text": "消耗全部护甲并攻击全体敌人。标准基础倍率按普通／稀有／史诗为100%／120%／140%；每点消耗护甲增加1个百分点。独立牌面基础按该牌说明。", "example": "当前可消耗：300护甲"}, {"name": "治疗反转", "kind": "动作", "text": "把本次治疗量转为敌人的生命伤害，消耗药效1次。具体对该目标的结果在目标预览显示。", "example": "反转量：155"}, {"name": "无视防御", "kind": "效果", "text": "本次攻击按指定数值忽略防御。牌面系数生成后按品质和队伍等级结算，不能再次放大已经生成的数值。", "example": "本次无视：36"}, {"name": "消耗", "kind": "机制", "text": "这张牌打出后进入本场消耗区，普通抽牌不会再抽到。已记录的法师任务仍计数。", "example": "本场已消耗"}, {"name": "临时复制", "kind": "机制", "text": "生成牌的临时副本，沿用对应品质与基础规则，费用以复制效果为准；临时牌按其有效期移除。", "example": "0费临时复制；本回合有效"}, {"name": "藏式", "kind": "机制", "text": "保存指定冲锋效果，在下回合第一张主动牌使用；未使用则该回合结束时失效。", "example": "已保存：〈冲锋效果〉"}, {"name": "开锋", "kind": "机制", "text": "本牌使用藏式时，额外触发它注明的开锋效果。", "example": "本次可以开锋"}, {"name": "余式", "kind": "机制", "text": "复制已使用的藏式，供本回合下一张主动牌再使用1次；不会再次产生余式。", "example": "剩余：1次"}, {"name": "血势", "kind": "机制", "text": "每点目标流血使牌面指定攻击的倍率增加2个百分点，不再对流血数值乘品质或等级。", "example": "按该牌当前目标的流血更新"}, {"name": "乘势", "kind": "机制", "text": "每层自身气势使牌面指定攻击的倍率增加10个百分点。未明确要求消耗时，不消耗气势。", "example": "按当前气势更新"}, {"name": "护甲", "kind": "资源", "text": "优先吸收可被护甲抵挡的伤害。所属阵营回合开始时清空；保留护甲效果及特定被动按其说明执行。", "example": "当前护甲：96"}, {"name": "内力", "kind": "资源", "text": "用于支付卡牌的内力费用。回复先补至上限，只有明确的溢出转甲效果会处理多余内力。", "example": "当前内力：34／34"}, {"name": "气力", "kind": "资源", "text": "全队共享的出牌资源；不足时无法出牌。阵赏返还在任务结算后到账。", "example": "当前气力：3"}, {"name": "气势", "kind": "状态", "text": "每层使每段直接攻击伤害增加1。普通攻击不消耗，也不会自动衰减；指定消耗效果和驱散另算。", "example": "当前：2层"}, {"name": "灵动", "kind": "状态", "text": "受到直接攻击时，25%概率消耗1层完成完美闪避；未成功但有至少2层时，消耗2层闪避。", "example": "当前：2层"}, {"name": "破绽", "kind": "状态", "text": "每层使下一段有效直接攻击伤害提高10%，结算后清空；保护破绽的明确效果例外。", "example": "当前：3层"}, {"name": "标记", "kind": "状态", "text": "有标记时，受到的直接攻击伤害提高15%；每段有效命中消耗1层。层数不重复增加15%增伤。", "example": "当前：2层"}, {"name": "虚弱", "kind": "状态", "text": "直接攻击伤害降低50%；所属阵营回合结束时减少1层。", "example": "当前：2层"}, {"name": "流血", "kind": "持续伤害", "text": "受到未被闪避的直接攻击后，按攻击前流血值失去生命。每次触发不消耗储量。", "example": "当前：24／100；每次触发24"}, {"name": "中毒", "kind": "持续伤害", "text": "所属阵营回合结束时，按当前中毒值失去生命。每次触发不消耗储量。", "example": "当前：30／100；回合结束30"}, {"name": "灼烧", "kind": "持续伤害", "text": "自己的一张牌或意图完整结算后，按当前灼烧值失去生命。多段行动只在行动结束后触发1次，不消耗储量。", "example": "当前：20／100；行动结束20"}, {"name": "蚀伤", "kind": "持续伤害", "text": "被毒爆或明确触发蚀伤的效果结算时，按当前值失去生命。不作为其他持续伤害的重复附加值，不消耗储量。", "example": "当前：10／100；触发时10"}, {"name": "药效", "kind": "资源", "text": "下一次治疗或治疗反转消耗全部药效，每点使基础治疗增加1，再统一应用增幅倍率。每累计获得6点药效，获得1层气势。", "example": "25点治疗加5点药效、600%增幅，结算180点"}, {"name": "蓄力", "kind": "资源", "text": "重箭使用的点数。牌面决定每点收益；新获得的蓄力是否参与本次重箭，取决于本牌的锁定时点。", "example": "当前：3点"}, {"name": "援护", "kind": "状态", "text": "下一次针对受护者的敌方单体直接攻击由援护者承受，消耗1次援护；双方任一倒下时关系结束。", "example": "剩余：2次；保护〈角色名〉"}, {"name": "反击", "kind": "状态", "text": "对方单体直接攻击牌完整结算后，反击1次并消耗1次。攻击部分采用登记此反击的品质；群攻和持续伤害不触发，也不连锁反击。", "example": "剩余：1次；造成120%的攻击伤害"}, {"name": "格挡", "kind": "状态", "text": "对方单体直接攻击牌完整结算后，反攻1次并消耗1次。伤害为按登记品质结算的100%攻击，加当时剩余护甲；不消耗护甲。", "example": "剩余：1次；攻击倍率120%，另加剩余护甲"}, {"name": "破绽免疫", "kind": "状态", "text": "无法获得新的破绽；已有破绽不会因此清除，此效果不会自行消耗。", "example": "生效中"}, {"name": "追击标记", "kind": "状态", "text": "下一次攻击的首段命中施加1层标记，出手后消耗1次。", "example": "剩余：1次"}, {"name": "破绽追击", "kind": "状态", "text": "下一次攻击的首段命中施加1层破绽，出手后消耗1次。", "example": "剩余：1次"}, {"name": "疗愈增幅", "kind": "状态", "text": "下一次治疗的每名目标各增加当前数值的治疗量，结算后清空。", "example": "增加治疗：6"}, {"name": "地势双效", "kind": "状态", "text": "下一次符合条件的地势收益额外结算1次，触发后消耗1次。", "example": "剩余：1次"}, {"name": "地势免耗", "kind": "状态", "text": "下一张地势牌不消耗气力，生效后消耗1次；内力费用保持。", "example": "剩余：1次"}, {"name": "地势减耗", "kind": "状态", "text": "下一张地势牌气力消耗−1，最低为0，生效后消耗1次。", "example": "剩余：1次"}, {"name": "代挡", "kind": "状态", "text": "把下一次敌方单体攻击转向本效果指定的友方，触发后消耗1次。", "example": "剩余：1次"}, {"name": "本回合地势双效", "kind": "状态", "text": "本回合下一次符合条件的地势收益额外结算1次；触发后或本回合结束时失效。", "example": "本回合剩余：1次"}, {"name": "财富", "kind": "敌方状态", "text": "上限8层，可强化钱鼠的指定招式，或被指定招式消耗；加成和消耗量以当前意图为准，转阶段保留。", "example": "当前：3／8"}, {"name": "狂怒", "kind": "敌方状态", "text": "上限5层，强化赤獠的指定招式；每张玩家主动牌造成生命伤害时最多增加1层，转阶段保留。", "example": "当前：2／5"}, {"name": "猎物", "kind": "敌方状态", "text": "被老虎锁定的目标。指定猎物的招式优先攻击该单位；具体更换条件以老虎当前阶段规则为准。", "example": "锁定目标：〈角色名〉"}, {"name": "蓄势", "kind": "敌方状态", "text": "显示敌方已准备意图的剩余等待回合，倒计时结束后执行该意图；普通驱散不能打断。", "example": "还需1回合；准备：〈招式〉"}, {"name": "地势", "kind": "机制", "text": "明确写出的地势收益按指定次数完整结算，品质不会再次放大地势本身。存活阵师伙伴还会在每个玩家回合开始自动触发1次。", "example": "当前：平原"}, {"name": "平原", "kind": "地势", "text": "全体敌人各获得基础值2的灼烧，随队伍等级生成。", "example": "百级示例：每人10灼烧"}, {"name": "断崖", "kind": "地势", "text": "全体敌人各获得2层破绽、1层标记。", "example": "每人2破绽、1标记"}, {"name": "山林", "kind": "地势", "text": "全体友方各恢复基础值10的生命，随队伍等级提高。", "example": "百级、零药效示例：每人50生命"}, {"name": "水岸", "kind": "地势", "text": "全体友方各回复3点内力。", "example": "每人回复3内力"}, {"name": "渡口", "kind": "地势", "text": "收益与水岸相同：全体友方各回复3点内力。", "example": "每人回复3内力"}, {"name": "村镇", "kind": "地势", "text": "抽1张，全体友方各获得20%防御的护甲。", "example": "防御100示例：每人20护甲"}, {"name": "洞窟", "kind": "地势", "text": "全体友方各获得40%防御的护甲、1次格挡。", "example": "防御100示例：每人40护甲、1次格挡"}], "aliases": [["守护", "援护", "只统一玩家文案，仍使用原守护关系和次数。"], ["地形双效／免耗／减耗", "地势双效／免耗／减耗", "与卡牌“地势”统一，不修改数值规则。"], ["敌人蓄力", "蓄势", "避免和玩家重箭点数同名；只改文字，不改敌人准备意图。"], ["方剂", "药方", "统一与现有pill用词，保留独立角色归属。"], ["珍稀卡牌", "史诗", "沿用
