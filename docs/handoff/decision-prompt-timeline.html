<script>
"use strict";

const shortTitles=["初始冒险闭环","真实入口与存档","转向队伍卡牌","共享气力与反馈","三章与装备经济","全屏 HUD 战斗","统一职业机制","转向桌面放置","临时卡 → 首领槽","整合桌面工作台","取消内嵌挑战","纯 2D 默认入口","查看与编队分离","百级与全队成长","共享库存与工具","桌面剧情任务","简化卡牌文本","锁定剧情画风","加入三章讨伐","金币与天赋校准","可靠保存与恢复","掉落与合成阶梯","乘风替换随机词缀","开局必须简单","构筑 × 开箱爽感","挑战暂停挂机","1 → 2 → 3 人","主线与月白入场","普通箱固定教学","工具教学不强迫","装备突破精英","自然触发与补课","首场实战发牌","治疗与护甲同场","击杀掉落飞入","F10 完整重置","1-2 开局可挑战","任务返回与领奖","意图前景与灼烧","技能点升级卡牌","卡组与教程修复","满包与仓库排序","商店／声音／置顶","动画与强敌横幅","女主卡牌与剧情","伙伴与怪物图鉴","联机／UGC／DLC"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kinds={"历史版本":"historical","修订决策":"revision","待做决策":"todo","原文记录":"raw"};
const phases=["全部","起步","构筑","转型","完善","引导","后续"];
let phase="全部",visible=decisions.slice(),selected=decisions.find(d=>"#"+d.id===location.hash)||decisions[0],timer;
function format(d){return "【"+d.date+" · "+d.id+" · "+d.kind+"】"+d.title+"\n"+d.prompt+(d.note?"\n\n说明："+d.note:"")+"\n来源："+d.source.label;}
function exportText(){return "《霞客行》决策 Prompt 时间线\n按记录日期排列，历史版本不可与后续修订同时当作现行规则。\n除原文记录外均为归纳，待做不代表已实现。\n\n"+visible.map(format).join("\n\n"+"—".repeat(32)+"\n\n");}
function toast(t){$("toast").textContent=t;$("toast").hidden=false;clearTimeout(timer);timer=setTimeout(()=>$("toast").hidden=true,2000);}
async function copyText(t){try{if(!navigator.clipboard)throw new Error("Unavailable");await navigator.clipboard.writeText(t);toast("已复制");}catch(e){$("copy-text").value=t;$("copy-dialog").showModal();$("copy-text").focus();$("copy-text").select();}}
function sourceHTML(s){return s.path?'<p><a href="'+esc(s.path)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a></p><div class="source-path">'+esc(s.path)+'</div>':'<p>'+esc(s.label)+'。会话内容已归档于本页。</p>';}
function stages(){ $("stages").innerHTML=phases.map(p=>'<button class="stage '+(p===phase?"active":"")+'" data-phase="'+p+'" aria-pressed="'+(phase===p)+'">'+p+'</button>').join(""); }
function drawRail(){
 let priorMonth="";
 $("rail").innerHTML=visible.map(d=>{
  const m=d.date.slice(0,7),isNew=m!==priorMonth;priorMonth=m;
  return '<button class="node '+(kinds[d.kind]||"")+(selected&&selected.id===d.id?" selected":"")+'" id="node-'+d.id+'" data-node="'+d.id+'" aria-pressed="'+(selected&&selected.id===d.id)+'" aria-label="'+d.date+' '+d.id+' '+esc(d.title)+'" title="'+esc(d.title)+' · '+d.kind+'">'+(isNew?'<span class="month-label">'+m.replace("-"," / ")+'</span>':"")+'<span class="when">'+d.date.slice(5).replace("-",".")+'</span><span class="point" aria-hidden="true"></span><span class="node-title">'+esc(shortTitles[decisions.indexOf(d)]||d.title)+'</span><span class="node-id">'+d.id+'</span></button>';
 }).join("");
}
function syncSelected(center){
 document.querySelectorAll("[data-node]").forEach(n=>{const active=selected&&n.dataset.node===selected.id;n.classList.toggle("selected",active);n.setAttribute("aria-pressed",String(active));});
 const i=selected?visible.findIndex(d=>d.id===selected.id):-1;
 $("ordinal").textContent=(i<0?"00":String(i+1).padStart(2,"0"))+" / "+String(visible.length).padStart(2,"0");
 $("prev").disabled=i<=0;$("next").disabled=i<0||i>=visible.length-1;
 $("selection").hidden=i<0;
 if(i<0)return;
 $("prompt-meta").innerHTML='<span class="code">'+selected.id+'</span><span>／ '+selected.date.replaceAll("-",".")+'</span><span class="tag '+(kinds[selected.kind]||"")+'">'+selected.kind+'</span><span>· '+selected.phase+'</span>';
 $("prompt-title").textContent=selected.title;$("prompt-body").textContent=selected.prompt;$("prompt-body").scrollTop=0;
 $("position").textContent="决策 "+String(i+1).padStart(2,"0")+" / "+visible.length;
 const successors=decisions.filter(d=>d.replaces.includes(selected.id));
 let context=selected.note?'<h3>这一条怎么看</h3><p class="note">'+esc(selected.note)+'</p>':'<h3>'+selected.phase+'阶段</h3><p>先读本条决策，再沿时间轴查看后续变化。</p>';
 if(selected.replaces.length)context+='<h3>承接／修订此前</h3><div class="relations">'+selected.replaces.map(id=>'<a href="#'+id+'" data-jump="'+id+'">'+id+'</a>').join("")+'</div>';
 if(successors.length)context+='<h3>后续变化</h3><div class="relations">'+successors.map(d=>'<a href="#'+d.id+'" data-jump="'+d.id+'" title="'+esc(d.title)+'">'+d.id+' ↗</a>').join("")+'</div>';
 $("context").innerHTML=context;
 $("sources").innerHTML=sourceHTML(selected.source)+(selected.extraSource?sourceHTML(selected.extraSource):"")+'<p>'+(selected.kind==="原文记录"?(selected.id==="P24"?"聊天原句节选拼接。":"原文保留。"):"依据记录整理为决策 Prompt，非逐字原始聊天。")+'</p>';
 try{history.replaceState(null,"","#"+selected.id);}catch(e){}
 if(center){const n=$("node-"+selected.id),scroller=$("axis-scroll");if(n)scroller.scrollTo({left:n.offsetLeft-scroller.clientWidth/2+n.offsetWidth/2,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"});}
}
function render(){
 const q=$("search").value.trim().toLowerCase(),kind=$("kind").value,month=$("month").value;
 visible=decisions.filter(d=>(phase==="全部"||d.phase===phase)&&(!kind||d.kind===kind)&&(!month||d.date.startsWith(month))&&(!q||[d.id,d.date,d.title,d.prompt,d.note,d.phase,d.source.label].join(" ").toLowerCase().includes(q)));
 if(!selected||!visible.some(d=>d.id===selected.id))selected=visible[0]||null;
 $("count").textContent=visible.length+" / "+decisions.length+" 个节点";
 $("empty").hidden=visible.length>0;$("axis-scroll").hidden=visible.length===0;
 $("copy-visible").disabled=$("export").disabled=$("print").disabled=visible.length===0;
 stages();drawRail();syncSelected(true);
 $("print-archive").innerHTML=visible.map(d=>'<article><h2>'+esc(d.date+' · '+d.id+' '+d.title)+'</h2><small>'+esc(d.kind)+' / '+esc(d.phase)+'</small><p>'+esc(d.prompt)+'</p><small>'+esc((d.note?d.note+' · ':"")+'来源：'+d.source.label)+'</small></article>').join("");
}
function select(id,center=true){const d=visible.find(x=>x.id===id);if(!d)return;selected=d;syncSelected(center);}
function reset(){phase="全部";$("search").value="";$("kind").value="";$("month").value="";render();}
function jump(id){if(!decisions.some(d=>d.id===id))return;if(!visible.some(d=>d.id===id))reset();select(id);}
function step(delta){if(!selected)return;const i=visible.findIndex(d=>d.id===selected.id),next=visible[i+delta];if(next)select(next.id);}
$("stages").addEventListener("click",e=>{const b=e.target.closest("[data-phase]");if(b){phase=b.dataset.phase;render();}});
$("search").addEventListener("input",render);$("kind").addEventListener("change",render);$("month").addEventListener("change",render);$("reset").addEventListener("click",reset);
$("rail").addEventListener("click",e=>{const n=e.target.closest("[data-node]");if(n)select(n.dataset.node);});
$("context").addEventListener("click",e=>{const a=e.target.closest("[data-jump]");if(a){e.preventDefault();jump(a.dataset.jump);}});
$("prev").addEventListener("click",()=>step(-1));$("next").addEventListener("click",()=>step(1));
$("origin").addEventListener("click",()=>{reset();select("P01");});
$("copy").addEventListener("click",()=>selected&&copyText(format(selected)));
$("copy-visible").addEventListener("click",()=>copyText(exportText()));
$("export").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob(["\ufeff"+exportText()],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="霞客行-决策Prompt-"+(phase==="全部"?"时间线":phase)+".txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("已导出 "+visible.length+" 条决策");});
$("print").addEventListener("click",()=>window.print());$("close-dialog").addEventListener("click",()=>$("copy-dialog").close());
$("axis-scroll").addEventListener("wheel",e=>{const el=e.currentTarget;if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)||el.scrollWidth<=el.clientWidth)return;const delta=e.deltaY;if((delta<0&&el.scrollLeft<=0)||(delta>0&&el.scrollLeft>=el.scrollWidth-el.clientWidth-1))return;e.preventDefault();el.scrollLeft+=delta;},{passive:false});
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)||$("copy-dialog").open)return;if(e.key==="ArrowRight"){e.preventDefault();step(1);}else if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}else if(e.key==="/"){e.preventDefault();$("search").focus();}});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(selected&&selected.id===id)return;jump(id);});
render();
</script>
</body></html>
