<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>057 大招 · 修帧对照</title><style>body{margin:0;background:#eee2c9;color:#30291e;font:18px/1.6 system-ui}main{max-width:1360px;margin:32px auto;padding:20px}h1{font-size:30px;margin:0}p{color:#665d4d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;border-radius:12px}h2{font-size:21px}button{background:#28564e;color:#fff;border:0;border-radius:7px;padding:10px 20px;font:inherit;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><main><h1>057 大招 · 保留气势，只修错误帧</h1><p>粗雷、穿梭、墨云和爆发保留。修正最后 11 帧的地面透视，其余 45 帧不变。</p><button onclick="document.querySelectorAll('img').forEach(i=>i.src=i.dataset.src+'?t='+Date.now())">同步重播</button><section class="grid"><div><h2>原版：地面冲击倾斜</h2><img data-src="before.gif" src="before.gif"></div><div><h2>修复：围绕落点水平扩散</h2><img data-src="after.gif" src="after.gif"></div></section><p>56 个原定位帧 · 保留原有播放节奏与方向 · 纯色底仅用于动图展示，游戏资产为透明 PNG。</p></main></html>
