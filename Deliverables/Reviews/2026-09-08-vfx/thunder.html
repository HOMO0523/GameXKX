<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粗落雷动作对比</title>
<style>
@font-face{font-family:Jianghu;src:url(jianghu.ttf)}
:root{--paper:#efe4cd;--ink:#352e24;--jade:#355b51;--line:#c2b290;--stage:#303931}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Microsoft YaHei",sans-serif}header,main,footer{max-width:1450px;margin:auto;padding:24px 32px}header{padding-bottom:14px}.eyebrow{color:#6c7867;letter-spacing:3px;font-size:12px}h1{font:42px/1.15 Jianghu,serif;margin:12px 0}header p{margin:12px 0;color:#685d4b;max-width:1000px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}button,select{font:inherit;color:inherit;background:#f7efdf;border:1px solid #baa987;border-radius:7px;padding:6px 12px;cursor:pointer}button:hover{border-color:var(--jade);background:#fff9ec}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ab6828;outline-offset:2px}.primary{background:var(--jade);color:#fff9e9;border-color:var(--jade)}.primary:hover{background:#284c42}.hint{font-size:12px;color:#766b5a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{background:#f8f0df;border:1px solid var(--line);border-radius:12px;overflow:hidden}article header{padding:15px 17px 12px}h2{font:27px/1.2 Jianghu,serif;margin:0;display:flex;align-items:baseline;gap:8px}.num{font:12px "Microsoft YaHei",sans-serif;color:#948265}.frames{margin-left:auto;font:12px "Microsoft YaHei",sans-serif;color:#7c705c}.use{font-size:12px;color:#6c7867;margin-top:7px}.stage{height:205px;position:relative;background:var(--stage);transition:background .15s;overflow:hidden}.stage canvas{width:100%;height:100%;display:block}.stage.paper{background:#e9ddc3}.loading{position:absolute;inset:0;display:grid;place-content:center;color:#efe6d3;font-size:12px}.controls{display:flex;align-items:center;gap:9px;padding:10px 13px}.controls button{font-size:13px;min-width:53px;padding:3px 7px}.controls input{width:100%;min-width:0;accent-color:var(--jade)}output{font-size:11px;white-space:nowrap;min-width:48px;text-align:right;color:#7b705d}.note{margin:0;padding:0 16px 12px;font-size:13px;min-height:58px;color:#625747}details{border-top:1px solid #ded1b5;padding:8px 16px;font-size:11px;color:#83755e}summary{cursor:pointer}details p{overflow-wrap:anywhere;line-height:1.5}.source-id{font-weight:bold;color:var(--jade)}footer{font-size:13px;color:#776b56;padding-top:0}footer details{padding:16px 0;border-top:1px solid var(--line)}footer a{color:var(--jade);margin-right:15px}.review-note{padding:12px 15px;background:#e3d7bc;border-radius:8px}body.small .stage{height:160px}.last-meta{font-size:12px;margin-top:12px}@media(min-width:1550px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header,main,footer{padding-left:20px;padding-right:20px}}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:34px}.toolbar{gap:8px}}
</style><style>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:340px}article header{padding:20px}h2{font-size:30px}.note{font-size:14px;min-height:70px}footer a{color:#355b51}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="eyebrow">第一包 / 动作参考</div><h1>更粗的落雷，放在一起看</h1><p>两条均来自第一包。右侧道士落雷的白色雷芯更厚、命中更集中；可暂停拖动，比较同一阶段的形状。</p><div class="toolbar"><button class="primary" id="all">全部暂停</button><label>预览速度 <select id="fps"><option value="12">12 帧/秒</option><option value="24" selected>24 帧/秒</option><option value="30">30 帧/秒</option></select></label><button id="backdrop">换成纸色底</button><button id="size">看小尺寸</button><span class="hint">可拖动每段进度逐帧查看；原文件未标帧率。</span></div></header>
<main><div class="grid" id="grid"></div></main>
<footer><p class="review-note">推荐右侧 A0040 作为重绘参考：保留粗主雷和短促爆发，减少分叉与柔光，再统一成黄色主体和深赭色轮廓。这里仍是原始序列，未做像素修改。</p><p><a href="index.html">返回上一版十段候选</a></p><p id="more" hidden></p></footer>
<script>
const data=[{"id": "A0867", "order": 1, "title": "之前的单束落雷", "use": "对照 · 11 帧", "note": "线条细，短促利落。与右侧保持同样的预览区域和等比缩放。", "source": "后【序列】/zhangjiao_skill3/zhangjiao_skill03-skill3_", "count": 11, "dimensions": [[441, 441], [441, 441], [441, 441], [441, 441], [441, 441], [441, 441], [441, 441], [441, 441], [441, 441], [441, 441], [441, 441]], "canvas": [441, 441], "frames": ["candidates/A0867/0000.png", "candidates/A0867/0001.png", "candidates/A0867/0002.png", "candidates/A0867/0003.png", "candidates/A0867/0004.png", "candidates/A0867/0005.png", "candidates/A0867/0006.png", "candidates/A0867/0007.png", "candidates/A0867/0008.png", "candidates/A0867/0009.png", "candidates/A0867/0010.png"]}, {"id": "A0040", "order": 2, "title": "更粗的道士落雷", "use": "推荐 · 15 帧", "note": "命中瞬间的白色雷芯更厚，落点爆发更强。重绘时保留粗主干，减少旁侧细分叉。", "source": "中【序列】/daoshi_skill1/002/1/daoshi_skill1_2-animation_", "count": 15, "dimensions": [[450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550], [450, 550]], "canvas": [450, 550], "frames": ["candidates/A0040/0000.png", "candidates/A0040/0001.png", "candidates/A0040/0002.png", "candidates/A0040/0003.png", "candidates/A0040/0004.png", "candidates/A0040/0005.png", "candidates/A0040/0006.png", "candidates/A0040/0007.png", "candidates/A0040/0008.png", "candidates/A0040/0009.png", "candidates/A0040/0010.png", "candidates/A0040/0011.png", "candidates/A0040/0012.png", "candidates/A0040/0013.png", "candidates/A0040/0014.png"]}];const players=[];let fps=24,small=false,allPlaying=true;const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
class Player{
 constructor(d){this.d=d;this.index=Math.floor(d.count*.35);this.playing=true;this.last=performance.now()+800;this.cache=new Map();this.pending=new Map();this.visible=false;this.dead=false;this.failed=false;
 this.el=document.createElement('article');this.el.id=d.id;
 this.el.innerHTML=`<header><h2><span class="num">${String(d.order).padStart(2,'0')}</span>${esc(d.title)}<span class="frames">${d.count} 帧</span></h2><div class="use">${esc(d.use)}</div></header><div class="stage"><canvas width="640" height="360" aria-label="${esc(d.title)}动画"></canvas><div class="loading">读取原始帧…</div></div><div class="controls"><button class="play">暂停</button><input aria-label="${esc(d.title)}帧进度" type="range" min="0" max="${d.count-1}" value="${this.index}"><output></output></div><p class="note">${esc(d.note)}</p><details><summary>原素材 <span class="source-id">${d.id}</span></summary><p>${esc(d.source)}<br>原画布：${d.canvas[0]} × ${d.canvas[1]}</p></details>`;
 document.getElementById('grid').append(this.el);this.canvas=this.el.querySelector('canvas');this.ctx=this.canvas.getContext('2d');this.slider=this.el.querySelector('input');this.counter=this.el.querySelector('output');this.button=this.el.querySelector('.play');
 this.button.onclick=()=>this.setPlaying(!this.playing);this.slider.oninput=()=>{this.setPlaying(false);this.index=Number(this.slider.value);this.draw()};
 const stage=this.el.querySelector('.stage');stage.style.display='flex';stage.style.alignItems='center';stage.style.justifyContent='center';
 this.resizeObserver=new ResizeObserver(()=>{const width=Math.min(stage.clientWidth,stage.clientHeight*640/360);this.canvas.style.width=width+'px';this.canvas.style.height=width*360/640+'px'});this.resizeObserver.observe(stage);this.draw();
 }
 setPlaying(v){this.playing=v;this.button.textContent=v?'暂停':'播放';this.last=performance.now()}
 async load(index){if(this.cache.has(index))return this.cache.get(index);if(this.pending.has(index))return this.pending.get(index);
 const p=(async()=>{const im=new Image();im.src=this.d.frames[index];await im.decode();const factor=Math.min(1,640/this.d.canvas[0],360/this.d.canvas[1]);const bitmap=await createImageBitmap(im,{resizeWidth:Math.max(1,Math.round(im.width*factor)),resizeHeight:Math.max(1,Math.round(im.height*factor)),resizeQuality:'high'});this.cache.set(index,bitmap);return bitmap})();
 this.pending.set(index,p);try{return await p}finally{this.pending.delete(index)} }
 async draw(){const wanted=this.index;this.slider.value=wanted;this.counter.value=`${wanted+1} / ${this.d.count}`;this.el.dataset.frame=String(wanted);
 try{const bitmap=await this.load(wanted);if(this.index!==wanted)return;const ctx=this.ctx;ctx.clearRect(0,0,640,360);const f=small?.43:.88;ctx.drawImage(bitmap,(640-bitmap.width*f)/2,(360-bitmap.height*f)/2,bitmap.width*f,bitmap.height*f);this.el.querySelector('.loading').style.display='none';this.failed=false;}catch(e){this.failed=true;this.el.querySelector('.loading').textContent='这一帧读取失败';console.error(this.d.id,wanted,e)}
 }
 tick(t){if(!this.playing||!this.visible||document.hidden)return;if(t-this.last<1000/fps)return;if(this.pending.size>2)return;this.last=t;this.index=(this.index+1)%this.d.count;if(this.index===0)this.last+=500;this.draw();this.load((this.index+1)%this.d.count).catch(()=>{})}
}
for(const d of data)players.push(new Player(d));const observer=new IntersectionObserver(entries=>{for(const e of entries)players.find(p=>p.el===e.target).visible=e.isIntersecting},{rootMargin:'100px'});players.forEach(p=>observer.observe(p.el));function tick(t){players.forEach(p=>p.tick(t));requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.getElementById('all').onclick=()=>{allPlaying=!allPlaying;players.forEach(p=>p.setPlaying(allPlaying));document.getElementById('all').textContent=allPlaying?'全部暂停':'全部播放'};
document.getElementById('fps').onchange=e=>{fps=Number(e.target.value)};
document.getElementById('backdrop').onclick=e=>{const paper=!document.querySelector('.stage').classList.contains('paper');document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('paper',paper));e.target.textContent=paper?'换成深色底':'换成纸色底'};
document.getElementById('size').onclick=e=>{small=!small;document.body.classList.toggle('small',small);e.target.textContent=small?'恢复正常尺寸':'看小尺寸';players.forEach(p=>p.draw())};
document.getElementById('more').innerHTML=Array.from({length:9},(_,i)=>`<a href="inspection-neutral-${i+1}.html" target="_blank">初筛 ${i+1}</a>`).join('');
window.review={async seekAll(fraction){players.forEach(p=>{p.setPlaying(false);p.index=Math.min(p.d.count-1,Math.floor(p.d.count*fraction))});await Promise.all(players.map(p=>p.draw()))},state(){return players.map(p=>({id:p.d.id,frame:p.index,loaded:p.cache.size,failed:p.failed,playing:p.playing}))},playAll(){players.forEach(p=>p.setPlaying(true))}};
</script></body></html>
